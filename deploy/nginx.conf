server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Replace these two locations with the backend proxy when its API is ready.
    # A missing backend must never fall through to the SPA's index.html.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_NOT_CONFIGURED","message":"Backend is not configured"}';
    }
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_NOT_CONFIGURED","message":"Backend is not configured"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
