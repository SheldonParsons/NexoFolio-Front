server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Replace these two locations with the backend proxy when its API is ready.
    # A missing backend must never fall through to the SPA's index.html.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_NOT_CONFIGURED","message":"Backend is not configured"}';
    }
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_NOT_CONFIGURED","message":"Backend is not configured"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # Serve real MCP documentation to agents that do not execute frontend JS.
    location ~ ^/docs/mcp/?$ {
        try_files /mcp.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /mcp.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/docs/api/?$ {
        try_files /api.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /api.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Keep the interactive logo working even when system mime.types omits mjs.
    location = /nexofolio/nexofolio-elastic.mjs {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Only serve real files. Static directories such as /docs must not
        # intercept Vue Router paths or cause directory-index 403 responses.
        try_files $uri /index.html;
    }
}
