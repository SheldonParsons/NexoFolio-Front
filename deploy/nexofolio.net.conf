# Install as /etc/nginx/conf.d/nexofolio.net.conf (included by existing nginx.conf).
# Install only AFTER Certbot has issued the certificate (see aliyun.md).
server {
    listen 80;
    server_name nexofolio.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://nexofolio.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nexofolio.net;
    ssl_certificate /etc/letsencrypt/live/nexofolio.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexofolio.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NexoFolioSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/nexofolio/front/current/dist;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Host Nginx proxies to the backend's loopback-only Docker port.
    location = /api {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_intercept_errors off;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        client_max_body_size 8m;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # Serve real MCP documentation to agents that do not execute frontend JS.
    location ~ ^/docs/mcp/?$ {
        try_files /mcp.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /mcp.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/docs/api/?$ {
        try_files /api.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /api.md {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    # Older system mime.types files may omit mjs. Module imports require JS MIME.
    location = /nexofolio/nexofolio-elastic.mjs {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        # Only serve real files. Static directories such as /docs must not
        # intercept Vue Router paths or cause directory-index 403 responses.
        try_files $uri /index.html;
    }
}
