# Install as /etc/nginx/conf.d/nexofolio.net.conf (included by existing nginx.conf).
# Install only AFTER Certbot has issued the certificate (see aliyun.md).
server {
    listen 80;
    server_name nexofolio.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://nexofolio.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nexofolio.net;
    ssl_certificate /etc/letsencrypt/live/nexofolio.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexofolio.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NexoFolioSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/nexofolio/front/current/dist;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Backend integration is deliberately pending for this deployment.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_NOT_CONFIGURED","message":"Backend is not configured"}';
    }
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"BACKEND_NOT_CONFIGURED","message":"Backend is not configured"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # Older system mime.types files may omit mjs. Module imports require JS MIME.
    location = /nexofolio/nexofolio-elastic.mjs {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
