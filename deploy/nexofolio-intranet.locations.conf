# Include this file INSIDE the existing port-80 server block.
# Frontend release channel: intranet; application base: /nexofolio/.
location = /nexofolio {
    return 301 /nexofolio/$is_args$args;
}

location = /nexofolio/api {
    return 308 /nexofolio/api/$is_args$args;
}

location ^~ /nexofolio/api/ {
    # The trailing slash replaces /nexofolio/api/ with / on the upstream.
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 240s;
    client_max_body_size 8m;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
}

location = /nexofolio/index.html {
    alias /home/nexofolio/front/current/dist/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

# Documentation is also readable by clients that do not execute JavaScript.
location = /nexofolio/docs/mcp {
    alias /home/nexofolio/front/current/dist/mcp.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}
location = /nexofolio/docs/mcp/ {
    rewrite ^ /nexofolio/docs/mcp last;
}
location = /nexofolio/docs/api {
    alias /home/nexofolio/front/current/dist/api.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}
location = /nexofolio/docs/api/ {
    rewrite ^ /nexofolio/docs/api last;
}
location = /nexofolio/mcp.md {
    alias /home/nexofolio/front/current/dist/mcp.md;
    types { text/markdown md; }
    add_header Cache-Control "no-cache" always;
}
location = /nexofolio/api.md {
    alias /home/nexofolio/front/current/dist/api.md;
    types { text/markdown md; }
    add_header Cache-Control "no-cache" always;
}

# The asset itself lives in dist/nexofolio/, below the application prefix.
location = /nexofolio/nexofolio/nexofolio-elastic.mjs {
    alias /home/nexofolio/front/current/dist/nexofolio/nexofolio-elastic.mjs;
    types { text/javascript mjs; }
    add_header Cache-Control "no-cache" always;
}

location ^~ /nexofolio/assets/ {
    alias /home/nexofolio/front/current/dist/assets/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /nexofolio/ {
    alias /home/nexofolio/front/current/dist/;
    # Match files only. Existing documentation directories must not cause 403.
    # An internal redirect stays inside this application's index location.
    try_files $uri /nexofolio/index.html;
    add_header Cache-Control "no-cache" always;
}
